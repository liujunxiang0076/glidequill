<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GlideQuill · 手势工作台</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#263c36;background:#f7f6f0;font:15px "Segoe UI","Microsoft YaHei",sans-serif}button,select{font:inherit;color:inherit;cursor:pointer}button,select{background:transparent;border:1px solid #a9b3a7;border-radius:5px;padding:8px 15px}button:hover,button:focus-visible,select:focus-visible{background:#dce7dc}header,main,footer{max-width:1160px;margin:auto;padding:0 42px}header{height:78px;display:flex;align-items:center;gap:15px;border-bottom:1px solid #bbc4b9}header b{font:italic bold 32px Georgia;color:#214e40}header small{border-left:1px solid #abb9ac;padding-left:16px}header button{margin-left:auto}main{padding-top:30px}h1{font:600 36px "Microsoft YaHei",sans-serif;letter-spacing:2px;margin:0}h2{font-size:18px;margin:0}p{line-height:1.6}.top,.tools,.bar,.row,footer{display:flex;align-items:center;gap:12px}.top{justify-content:space-between}.tabs{margin:18px 0 12px;display:flex;gap:5px}.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0}.tabs .on{border-color:#ad4e31;color:#98492c;font-weight:700}article{display:grid;grid-template-columns:1.9fr 1fr;border:1px solid #aab6a9;border-radius:9px;overflow:hidden;background:#fffcf4}.paper{position:relative;min-height:282px;background-color:#edf0e3;background-image:radial-gradient(#b7c3b0 1px,transparent 1px);background-size:16px 16px}.paper svg{width:100%;height:100%;position:absolute;touch-action:none}.paper span{position:absolute;top:17px;left:20px;font-size:13px;background:#edf0e3;padding:2px 4px}.paper small{position:absolute;left:24px;bottom:16px;background:#edf0e3}.detail{padding:24px;border-left:1px solid #bbc4b9}.detail h2{font-size:28px;margin:8px 0 18px}.detail small,.muted,footer{color:#56665d}.detail label{display:grid;gap:5px;font-size:13px}.detail select{width:100%}.primary{background:#225340;color:white;border-color:#225340}.primary:hover,.primary:focus-visible{background:#32694f}.bar{justify-content:space-between;margin:22px 0 8px}.row{width:100%;text-align:left;border:0;border-top:1px solid #c7cec0;border-radius:0;padding:10px 12px}.row.sel{background:#e7ecdf}.row strong{width:38px;font-size:22px;color:#9c482c}.row b{flex:1}.row small{width:100px}footer{border-top:1px solid #bbc4b9;margin-top:20px;padding-top:10px;justify-content:space-between;font-size:12px}dialog{color:inherit;background:#fffcf4;border:1px solid #aab6a9;border-radius:8px;max-width:440px}dialog::backdrop{background:#20352955}dialog button{float:right}.tools{flex-wrap:wrap}@media(max-width:760px){header,main,footer{padding-left:16px;padding-right:16px}article{grid-template-columns:1fr}.detail{border-left:0}.paper{min-height:210px}.top{flex-wrap:wrap}}
</style>
<header><b>GlideQuill</b><small>拂标</small><button id="pause">Ⅱ　暂停手势</button></header>
<main><div class="top"><h1>手势工作台</h1><div class="tools"><button id="prefs">偏好设置</button><button id="imp">导入旧配置 ↗</button></div></div>
<nav class="tabs" aria-label="规则作用域"><button class="on">通用规则</button><button>浏览器</button></nav>
<article><div class="paper"><svg id="pad" viewBox="0 0 600 265" aria-label="手势试画区"><g id="sample"><path id="stroke" d="M445 98 Q320 94 159 145" fill="none" stroke="#245d47" stroke-width="8" stroke-linecap="round"/><path id="arrow" d="M186 117 L154 146 L197 154" stroke="#245d47" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle id="start" cx="445" cy="98" r="10" fill="#f8f8ed" stroke="#ad5234" stroke-width="4"/></g><polyline id="ink" stroke="#a64e32" stroke-width="5" fill="none"/></svg><span>轨迹练习纸</span><small id="hint" aria-live="polite">空心圆为起点 · 按住右键试画，松开查看结果</small></div>
<div class="detail"><small id="scope"></small><h2 id="title"></h2><label>执行动作<select id="action"><option>后退</option><option>前进</option><option>复制</option><option>回到页首</option><option>粘贴</option></select></label><p><button class="primary" id="save">保存规则</button></p><small id="status" aria-live="polite">练习不会执行系统动作</small></div></article>
<div class="bar"><h2>已绑定的手势</h2><small class="muted">选择一行查看或编辑</small></div><div id="rows"></div></main>
<footer><span id="state">●　手势已启用</span><span>本地交互原型 · 示例配置</span></footer>
<dialog id="modal"><h2 id="dt"></h2><div id="dc"></div><form method="dialog"><button>返回工作台</button></form></dialog>
<script>
const el=id=>document.getElementById(id),sets=[['后退','前进','复制'],['后退','前进','回到页首']],names=['向左划','向右划','向上划'],icons=['←','→','↑'];let group=0,sel=0,paused=false,pts=[];
function show(){el('title').textContent=names[sel];el('scope').textContent=group?'作用于浏览器':'作用于普通窗口';el('action').value=sets[group][sel];el('sample').setAttribute('transform',['','translate(600 0) scale(-1 1)','translate(300 132) rotate(90) scale(.64) translate(-300 -132)'][sel]);el('ink').setAttribute('points','');el('sample').style.display='';el('hint').textContent='空心圆为起点 · 按住右键试画，松开查看结果';el('rows').replaceChildren();names.forEach((n,i)=>{const b=document.createElement('button');b.className='row '+(sel===i?'sel':'');b.innerHTML='<strong>'+icons[i]+'</strong><b>'+n+'</b><small>'+sets[group][i]+'</small><span>›</span>';b.onclick=()=>{sel=i;show()};el('rows').append(b)});document.querySelectorAll('.tabs button').forEach((b,i)=>b.classList.toggle('on',i===group))}
document.querySelectorAll('.tabs button').forEach((b,i)=>b.onclick=()=>{group=i;show()});el('save').onclick=()=>{sets[group][sel]=el('action').value;show();el('status').textContent='已保存到本次预览'};el('pause').onclick=()=>{paused=!paused;el('state').textContent=paused?'○　手势已暂停':'●　手势已启用';el('pause').textContent=paused?'▷　恢复手势':'Ⅱ　暂停手势'};
function panel(t,html){el('dt').textContent=t;el('dc').innerHTML=html;el('modal').showModal()}
el('imp').onclick=()=>panel('旧配置迁移预览','<p>示例 MouseInc 配置</p><p>36 个轨迹模板 · 22 条通用绑定 · 13 条应用绑定</p><p>复制、后退等基础动作可迁移。截图或高级动作保留轨迹，规则标为待支持；原已停用的热键保持停用。</p><p>此处演示预览布局，不读取本机文件。</p>');
el('prefs').onclick=()=>panel('偏好设置','<p>首版设置规划</p><ul><li>手势识别距离、超时和灵敏度</li><li>轨迹显示与练习反馈</li><li>排除应用与忽略全屏</li><li>开机启动与配置恢复</li></ul>');
const pad=el('pad');function point(e){let p=new DOMPoint(e.clientX,e.clientY).matrixTransform(pad.getScreenCTM().inverse());return [p.x,p.y]}
pad.oncontextmenu=e=>e.preventDefault();pad.onpointerdown=e=>{if(e.button!==2||paused)return;pts=[point(e)];pad.setPointerCapture(e.pointerId);el('sample').style.display='none';el('ink').setAttribute('points','')};pad.onpointermove=e=>{if(!pts.length)return;pts.push(point(e));el('ink').setAttribute('points',pts.join(' '))};pad.onpointerup=e=>{if(!pts.length)return;const [x,y]=pts[0],[a,b]=point(e),dx=a-x,dy=b-y;pts=[];let i=Math.max(Math.abs(dx),Math.abs(dy))<20?-1:Math.abs(dx)>Math.abs(dy)?(dx<0?0:1):(dy<0?2:-1);el('hint').textContent=i<0?'未命中示例手势':'试画命中：'+names[i]+' → '+sets[group][i]};pad.onpointercancel=()=>{pts=[];show()};show()
</script></html>
